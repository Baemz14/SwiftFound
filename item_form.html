<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SwiftFound | Post Found Item Form</title>
</head>
<body>
    <form method="POST" action="#">
        <label for="title">Title:</label>
        <input type="text" id="title" name="title"><br><br>

        <label for="category">Category:</label>
        <select id="category">
            <option value="">Select a category</option>
            <option value="electronics">Electronics</option>
            <option value="jewelry">Jewelry</option>
            <option value="documents">Documents</option>
            <option value="other">Other</option>
        </select><br><br>

        <label for="description">Description:</label>
        <textarea id="description"></textarea><br><br>

        <label for="location">Location:</label>
        <input type="text" id="location"><br><br>

        <label for="secret_question">Secret Question (for verification):</label>
        <input type="text" id="secret_question" name="secret_question" placeholder="e.g., What color was it?" required><br><br>

        <button type="submit">Submit</button>
    </form>
</body>
</html>
